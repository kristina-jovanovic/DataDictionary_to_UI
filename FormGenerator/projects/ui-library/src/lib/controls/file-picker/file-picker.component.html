<label class="ui-field">
  <span class="ui-field_label" *ngIf="node.label">
    {{ node.label }}<em *ngIf="node.isRequired"> *</em>
  </span>
  <input
    type="file"
    class="ui-file_input"
    [attr.accept]="accept"
    (change)="onFile($event)" />
  <span class="ui-file_name" *ngIf="fileName">{{ fileName }}</span>
  <img *ngIf="previewUrl" [src]="previewUrl" class="ui-file_preview" alt="" />
</label>
